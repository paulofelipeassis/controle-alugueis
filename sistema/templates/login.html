{% extends "base.html" %}
{% block titulo %}Entrar · Controle de Aluguéis{% endblock %}
{% block conteudo %}
<article class="entrada">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></div>
  <h2>Controle de Aluguéis</h2>
  <p class="legenda">Entre para continuar</p>
  <form method="post" action="/login">
    <label>Login <input type="text" name="login" value="{{ login or '' }}" autocomplete="username" autocapitalize="none" autofocus required></label>
    <label>Senha <input type="password" name="senha" autocomplete="current-password" required></label>
    <button type="submit" style="width: 100%;">Entrar</button>
  </form>
</article>
{% endblock %}
