{% extends "base.html" %}
{% block conteudo %}
<article style="max-width: 24rem; margin: 2rem auto;">
  <h2>Entrar</h2>
  <form method="post" action="/login">
    <label>Login <input type="text" name="login" value="{{ login or '' }}" autocomplete="username" autocapitalize="none" required></label>
    <label>Senha <input type="password" name="senha" autocomplete="current-password" required></label>
    <button type="submit">Entrar</button>
  </form>
</article>
{% endblock %}
