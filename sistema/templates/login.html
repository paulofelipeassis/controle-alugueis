{% extends "base.html" %}
{% block titulo %}Entrar · Controle de Aluguéis{% endblock %}
{% block conteudo %}
<article class="entrada">
  <h2 style="color: inherit; font-size: 1.5rem; font-weight: 700;">Entrar</h2>
  <form method="post" action="/login">
    <label>Login <input type="text" name="login" value="{{ login or '' }}" autocomplete="username" autocapitalize="none" autofocus required></label>
    <label>Senha <input type="password" name="senha" autocomplete="current-password" required></label>
    <button type="submit" style="width: 100%;">Entrar</button>
  </form>
</article>
{% endblock %}
